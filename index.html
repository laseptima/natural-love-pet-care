<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="aVbiSxJSfhnj-vJMQ5o2H3LDgJ836sOEOJPz7Xf5lvo" />

    <!-- SEO: título y descripción -->
    <title>Natural Love | Productos de higiene para mascotas en Medellín</title>
    <meta name="description" content="Natural Love ofrece shampoo, bálsamo y perfume para mascotas, con soluciones para hogar y profesionales del grooming en Medellín, Colombia." />
    <link rel="canonical" href="https://naturallovepets.com/" />

    <!-- Favicon — usa el logo oficial. Si cambias el archivo, actualiza esta ruta -->
    <link rel="icon" type="image/png" href="/images/logo_natural_love.png" />
    <link rel="apple-touch-icon" href="/images/logo_natural_love.png" />

    <!-- Open Graph / Social Preview — logo oficial -->
    <meta property="og:title" content="Natural Love | Productos de higiene para mascotas en Medellín" />
    <meta property="og:description" content="Shampoo, bálsamo y perfume para mascotas. Soluciones para hogar y grooming profesional." />
    <meta property="og:image" content="/images/logo_natural_love.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Natural Love | Productos de higiene para mascotas en Medellín" />
    <meta name="twitter:description" content="Shampoo, bálsamo y perfume para mascotas. Soluciones para hogar y grooming profesional." />
    <meta name="twitter:image" content="/images/logo_natural_love.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Natural Love",
      "description": "Productos de higiene para mascotas en Medellín, Colombia",
      "url": "https://naturallovepets.com",
      "logo": "/images/logo_natural_love.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Medellín",
        "addressRegion": "Antioquia",
        "addressCountry": "CO"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+57-319-540-4226",
        "contactType": "sales"
      }
    }
    </script>

    <!-- Fonts: Sora (headings) + Figtree (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
